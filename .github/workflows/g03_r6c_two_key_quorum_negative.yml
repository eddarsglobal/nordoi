name: NORDOI G0.3 R6C true two-key same-admin quorum denial
on:
  pull_request:
    paths:
      - 'research/g03_r6c_two_key_quorum_negative.py'
      - 'research/test_g03_r6c_two_key_quorum_negative.py'
      - 'research/G03_R6C_TWO_KEY_NO_INDEPENDENT_QUORUM.json'
      - 'research/G03_R6C_TWO_KEY_QUORUM_QUALIFICATION.md'
      - '.github/workflows/g03_r6c_two_key_quorum_negative.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  true-two-key-sshsig-same-admin-not-external-quorum:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: R6C real owner candidate SSHSIG two-key negative quorum case
        run: python -B -m unittest discover -s research -p 'test_g03_r6c_two_key_quorum_negative.py' -v
      - name: R6A R6B original response and challenge negative regressions
        run: python -B -m unittest discover -s research -p 'test_g03_r6*.py' -v
      - name: R5A through R5Z original real research negative tests
        run: python -B -m unittest discover -s research -p 'test_g03_r5*.py' -v
      - name: R4Z independent custody handoff original negative tests
        run: python -B -m unittest discover -s research -p 'test_g03_r4z_handoff.py' -v
      - name: R4Y independent custody intake original negative tests
        run: python -B -m unittest discover -s research -p 'test_g03_r4y_external_custody_intake.py' -v
      - name: Original native R4M real signed XPC CDHash 6 serial once no retry waiver
        if: startsWith(matrix.os, 'macos')
        timeout-minutes: 8
        run: cargo test --offline --release --test g03_r4m_pinned_code_identity_lab -- --nocapture --test-threads=1
      - name: All twelve independently authenticated native admission gates still unmet
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import json
          old=json.load(open('research/G03_R6B_SIGNED_RESPONSE_NO_EXTERNAL_AUTHORITY.json',encoding='utf-8'))
          new=json.load(open('research/G03_R6C_TWO_KEY_NO_INDEPENDENT_QUORUM.json',encoding='utf-8'))
          a,b=old['required_gates'],new['required_gates']
          assert len(a)==len(b)==12
          assert [x['id'] for x in a]==[x['id'] for x in b]
          assert all(x['status']=='UNMET_INDEPENDENT_EXTERNAL_EVIDENCE' for x in b)
          assert new['native_admission_gates_unmet']==12
          assert new['separate_administrative_custodians_proven'] is False
          assert new['authenticated_owner_oob_root'] is None
          assert new['independently_authenticated_external_operator'] is None
          assert new['independent_two_authority_quorum'] is False
          assert new['global_monotonic_antirollback'] is False
          assert new['production']=='NOT_AUTHORIZED'
          print('R6C_REAL_TWO_LOCAL_KEYS_NOT_INDEPENDENT_QUORUM=PASS; 12_NATIVE_GATES=UNMET')
          PY
