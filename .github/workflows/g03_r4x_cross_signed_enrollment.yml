name: NORDOI G0.3 R4X cross-signed guardian enrollment preflight
on:
  pull_request:
    paths:
      - 'tests/g03_r4x_cross_signed_timeboxed_enrollment_lab.rs'
      - 'research/G03_R4X_CROSS_SIGNED_TIMEBOXED_GUARDIAN_ENROLLMENT.md'
      - '.github/workflows/g03_r4x_cross_signed_enrollment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-macos-dual-enrollment:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Dual Ed25519 SSHSIG, challenge and time-bound admission denial
        run: cargo test --offline --release --test g03_r4x_cross_signed_timeboxed_enrollment_lab -- --nocapture
      - name: R4W original independent-custody preflight regression
        if: always()
        run: cargo test --offline --release --test g03_r4w_external_guardian_enrollment_dossier_lab
      - name: Strict Rustfmt
        if: always()
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        if: always()
        run: cargo clippy --offline --all-targets -- -D warnings
  portable-default-denial:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Portable reference model remains deny-only
        run: cargo test --offline --release --test g03_r4x_cross_signed_timeboxed_enrollment_lab
