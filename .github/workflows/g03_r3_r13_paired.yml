name: NORDOI G0.3 R3-R13 atomic kernel safety probe
on:
  pull_request:
    paths:
      - 'src/kernel.rs'
      - 'tests/g03_r3_r13_redundant_lookup.rs'
      - 'research/g03_r3_r13_kernel_probe.rs'
      - 'research/g03_r3_r13_paired_mac.py'
      - 'research/G03_R3_R13_ENGINEERING.md'
      - '.github/workflows/g03_r3_r13_paired.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-safety:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Provenance/receipt synthetic selftest
        run: python -B research/g03_r3_r13_paired_mac.py selftest
      - name: Rust regression tests and in-process executable smoke
        run: python -B research/g03_r3_r13_paired_mac.py smoke --source .
