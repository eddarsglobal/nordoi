name: NORDOI G0.3 R4D governed native host adapter
on:
  pull_request:
    paths:
      - 'tests/g03_r4d_governed_host_adapter_lab.rs'
      - 'research/G03_R4D_GOVERNED_HOST_ADAPTER_LAB.md'
      - '.github/workflows/g03_r4d_governed_host_adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-host-adapter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Actual OS file, modeled authority, synchronized revoke race
        run: cargo test --offline --release --test g03_r4d_governed_host_adapter_lab
      - name: Formatting gate
        run: cargo fmt --all -- --check
