name: NORDOI G0.3 R3-R3 Python research selftest
on:
  pull_request:
    paths:
      - 'research/g03_r3_r3_host_load_replication.py'
      - '.github/workflows/g03_r3_r3_python_selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-research-selftest:
    name: Research Python selftest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile script without invoking benchmark
        run: python -m py_compile research/g03_r3_r3_host_load_replication.py
      - name: Execute synthetic selftest only
        run: python -B research/g03_r3_r3_host_load_replication.py selftest
      - name: Enforce source-safety scope
        shell: bash
        run: |
          test -f research/g03_r3_r3_host_load_replication.py
          echo 'ACTUAL_MAC_MEASUREMENTS=NOT_EXECUTED_BY_CI'
          echo 'PRODUCTION=NOT_AUTHORIZED'
