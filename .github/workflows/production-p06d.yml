name: NORDOI Production P0.6D Remote Anchor Service Gate

on:
  push:
    branches: [production/p0.1]
  pull_request:
    branches: [production/p0.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-clippy:
    name: P0.6D Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Boundary policy
        run: python3 scripts/production_p06d_boundary_check.py --repo "$PWD"
      - name: Format
        run: cargo fmt --manifest-path production/native-remote-anchor-service-p06d/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path production/native-remote-anchor-service-p06d/Cargo.toml --all-targets -- -D warnings

  check:
    name: P0.6D Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Boundary policy
        run: python3 scripts/production_p06d_boundary_check.py --repo "$PWD"
      - name: Cargo check
        run: cargo check --locked --manifest-path production/native-remote-anchor-service-p06d/Cargo.toml --all-targets

  tests:
    name: P0.6D Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Boundary policy
        shell: bash
        run: python3 scripts/production_p06d_boundary_check.py --repo "$PWD"
      - name: Remote-anchor service tests
        run: cargo test --locked --manifest-path production/native-remote-anchor-service-p06d/Cargo.toml --all-targets
