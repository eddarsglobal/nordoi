name: NORDOI Production P0.2 Durable Trust Gate
on:
  push:
    branches:
      - production/p0.1
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: P0.2 Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path production/native-trust-p01/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path production/native-trust-p01/Cargo.toml --all-targets -- -D warnings
  check:
    name: P0.2 Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked --manifest-path production/native-trust-p01/Cargo.toml --all-targets
  test:
    name: P0.2 Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
    matrix:
      os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path production/native-trust-p01/Cargo.toml --all-targets
