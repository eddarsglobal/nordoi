name: NORDOI APP-019 receiver external HEAD pin and coherent rollback boundary
on:
  pull_request:
    paths:
      - 'examples/apps/app019_external_head_pin/**'
      - '.github/workflows/nordoi_app019_external_head_pin.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  C20_PARENT: 0aa1fe01fe9391ed67a0fa20f8af7280af56a1ad
jobs:
  external-head-pin-four-os:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact APP019 source and C20 parent, AI-only RoadMapGuardian
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$C20_PARENT" HEAD
          test -z "$(git status --porcelain)"
          python -B scripts/roadmap_guardian.py --audit
          python -B scripts/verify_ai_only_continuation.py --audit
      - name: Build authentic NORDOI Rust P2.7 engine
        shell: bash
        run: |
          set -euo pipefail
          cargo build --offline --bin nordoi
      - name: Forty APP019 adversarial tests and all 708 predecessor regressions
        shell: bash
        run: |
          set -euo pipefail
          PROOF="$RUNNER_TEMP/NORDOI_APP019_EXTERNAL_HEAD_PROOFS"
          mkdir -p "$PROOF"
          index=0
          total=0
          while IFS='|' read -r folder script expected; do
            test -n "$folder" || continue
            index=$((index+1))
            log="$PROOF/suite-$(printf '%02d' "$index")-$script.log"
            python -B -m unittest discover -s "$folder" -p "$script" -v 2>&1 | tee "$log"
            python - "$log" "$expected" <<'PY'
          import pathlib,re,sys
          log=pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          want=int(sys.argv[2])
          tests=re.findall(r"^Ran (\d+) tests in ",log,re.MULTILINE)
          assert len(tests)==1 and int(tests[0])==want,(sys.argv[1],tests,want)
          assert re.search(r"^OK(?: \(skipped=\d+\))?$",log,re.MULTILINE),log[-2000:]
          assert not re.search(r"^FAILED(?: |$)",log,re.MULTILINE),log[-2000:]
          PY
            printf '%s|%s|%s\n' "$folder" "$script" "$expected" >> "$PROOF/manifest.txt"
            total=$((total+expected))
          done <<'SUITES'
          examples/apps/app019_external_head_pin|test_app019.py|40
          examples/apps/app018_local_freshness|test_app018.py|40
          examples/apps/app017_receiver_revocation|test_app017.py|40
          examples/apps/app016_receiver_trust_policy|test_app016.py|40
          examples/apps/cert015_bureau_replay|test_cert015_r1.py|20
          examples/apps/app015_independent_native_replay|test_app015.py|40
          examples/apps/app014_portable_checkpoint|test_app014.py|40
          examples/apps/app013_verified_handoff|test_app013.py|40
          examples/apps/app012_clean_checkpoint|test_app012.py|40
          examples/apps/app011_verified_resume|test_app011.py|40
          examples/apps/app010_readonly_dag_audit|test_app010.py|40
          examples/apps/app009_agent_dag|test_app009.py|40
          examples/apps/app008_conditional_workflow|test_app008.py|33
          examples/apps/app007_pinned_replay|test_app007.py|24
          examples/apps/app006_readonly_audit|test_app006.py|40
          examples/apps/app005_agent_batch|test_app005.py|40
          examples/apps/app004_agent_json|test_agent_request.py|40
          examples/apps/app004_agent_json|test_app004.py|31
          examples/apps/app003_integrated_quality|test_app003.py|38
          examples/apps/app002_rule_bundle|test_app002.py|26
          examples/apps/app001_quality_gate|test_app001.py|16
          SUITES
          test "$index" -eq 21
          test "$total" -eq 748
          echo "APP019_SUITE_COUNT=21" | tee "$PROOF/qualification.txt"
          echo "APP019_TESTS_PER_OS=748" | tee -a "$PROOF/qualification.txt"
          echo "APP019_NEW_TESTS=40" | tee -a "$PROOF/qualification.txt"
          echo "APP019_REGRESSIONS=708" | tee -a "$PROOF/qualification.txt"
          echo "APP019_EXPLICIT_EXTERNAL_HEAD_AUTHENTICATION=NOT_PERFORMED" | tee -a "$PROOF/qualification.txt"
          echo "APP019_PRODUCTION=NOT_AUTHORIZED" | tee -a "$PROOF/qualification.txt"
      - name: Independent demonstration using actual Rust native receipts and full-coherent rollback
        shell: bash
        run: |
          set -euo pipefail
          python -B examples/apps/app019_external_head_pin/demo_app019.py \
            "$RUNNER_TEMP/NORDOI_APP019_EXTERNAL_HEAD_PROOFS" \
            2>&1 | tee "$RUNNER_TEMP/NORDOI_APP019_EXTERNAL_HEAD_PROOFS/demo.log"
      - name: Archive independently inspectable APP019 evidence for Bureau
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NORDOI_APP019_EXTERNAL_HEAD_${{ matrix.os }}
          path: ${{ runner.temp }}/NORDOI_APP019_EXTERNAL_HEAD_PROOFS/
          retention-days: 30
