name: NORDOI G0.3 R5L real SIGKILL restart and denial journal (research only)
on:
  pull_request:
    paths:
      - 'research/g03_r5l_crash_restart_denial_journal.py'
      - 'research/test_g03_r5l_crash_restart_denial_journal.py'
      - 'research/G03_R5L_NO_EXTERNAL_PERSISTENT_RECOVERY_AUTHORITY.json'
      - 'research/G03_R5L_CRASH_RESTART_DENIAL_LIMITS.md'
      - '.github/workflows/g03_r5l_crash_restart_denial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-process-death-sqlite-restart-and-parallel-denials:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: R5L actual SIGKILL and SQLite deny-only restart/concurrency
        run: python -B -m unittest discover -s research -p 'test_g03_r5l_crash_restart_denial_journal.py' -v
      - name: R5K two signed recovery intents and separate process TOCTOU
        run: python -B -m unittest discover -s research -p 'test_g03_r5k_concurrent_recovery_quarantine.py' -v
      - name: R5J native signed recovery refusal
        run: python -B -m unittest discover -s research -p 'test_g03_r5j_signed_recovery_quarantine.py' -v
      - name: R5I actual R5H signed revocation and second local floor
        run: python -B -m unittest discover -s research -p 'test_g03_r5i_revocation_floor.py' -v
      - name: R5H real native SSHSIG and SQLite revocation
        run: python -B -m unittest discover -s research -p 'test_g03_r5h_signed_revocation_lab.py' -v
      - name: R5G separate-process same-UID rollback negative
        run: python -B -m unittest discover -s research -p 'test_g03_r5g_effective_control_lab.py' -v
      - name: R5F real owner and guardian custody absence
        run: python -B -m unittest discover -s research -p 'test_g03_r5f_admin_custody_disqualifiers.py' -v
      - name: R5E local second-store witness
        run: python -B -m unittest discover -s research -p 'test_g03_r5e_second_store_witness.py' -v
      - name: R5D local spent nonce ledger
        run: python -B -m unittest discover -s research -p 'test_g03_r5d_local_monotonic_ledger.py' -v
      - name: R5C owner OOB root absence
        run: python -B -m unittest discover -s research -p 'test_g03_r5c_oob_root_consistency.py' -v
      - name: R5B native triple SSHSIG key-possession only
        run: python -B -m unittest discover -s research -p 'test_g03_r5b_triple_sshsig_verifier.py' -v
      - name: R5A external guardian operator missing
        run: python -B -m unittest discover -s research -p 'test_g03_r5a_external_operator_preflight.py' -v
      - name: R4Z no independent handoff
        run: python -B -m unittest discover -s research -p 'test_g03_r4z_handoff.py' -v
      - name: R4Y missing outside custody proof
        run: python -B -m unittest discover -s research -p 'test_g03_r4y_external_custody_intake.py' -v
      - name: No external durable denial or global monotonic privilege
        shell: bash
        run: |
          set -euo pipefail
          python -B -c 'import json; x=json.load(open("research/G03_R5L_NO_EXTERNAL_PERSISTENT_RECOVERY_AUTHORITY.json",encoding="utf-8")); assert x["real_independent_guardian"] is None and x["owner_authenticated_oob_trust_root"] is None and x["externally_protected_monotonic_witness"] is None and x["globally_durable_spent_nonce_register"] is None and x["independent_recovery_and_rotation_custodian"] is None and x["native_admission_gates_unmet"]==12 and x["production"]=="NOT_AUTHORIZED"'
