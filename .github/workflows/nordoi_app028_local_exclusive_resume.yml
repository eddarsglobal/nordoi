name: NORDOI APP-028 local exclusive native continuation
on:
  pull_request:
    paths:
      - 'examples/apps/app028_local_exclusive_resume/**'
      - 'governance/NORDOI_APP028_LOCAL_EXCLUSIVE_RESUME_V1.json'
      - 'RoadMap_APP028.md'
      - '.github/workflows/nordoi_app028_local_exclusive_resume.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  C20_PARENT: d7f0d3ab84c2f98eb8789c9e2c985353d203ac72
jobs:
  exclusive-continuation-four-os:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact APP028 source and APP027 C20 parent with Guardian
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$C20_PARENT" HEAD
          test -z "$(git status --porcelain)"
          git diff --exit-code "$C20_PARENT" -- src/ Cargo.toml Cargo.lock RoadMap.md Bureau.md scripts/roadmap_guardian.py governance/NORDOI_BUREAU_PLAN_v1.json
          python -B scripts/roadmap_guardian.py --audit
          python -B scripts/app_research_guardian.py --audit
          python -B scripts/verify_ai_only_continuation.py --audit
      - name: Build authentic NORDOI Rust P2.7 engine
        shell: bash
        run: |
          set -euo pipefail
          cargo build --offline --bin nordoi
      - name: Regression preflight on actual OS for APP022 live witness
        shell: bash
        run: |
          set -euo pipefail
          python -B examples/apps/app022_live_freshness_witness/preflight_app022_loopback.py
      - name: 12 exclusive reservation tests and 950 prior native APP regressions
        shell: bash
        run: |
          set -euo pipefail
          PROOF="$RUNNER_TEMP/NORDOI_APP028_EXCLUSIVE_PROOFS"
          mkdir -p "$PROOF"
          index=0
          total=0
          while IFS='|' read -r folder script expected; do
            test -n "$folder" || continue
            index=$((index+1))
            log="$PROOF/suite-$(printf '%02d' "$index")-$script.log"
            python -B -m unittest discover -s "$folder" -p "$script" -v 2>&1 | tee "$log"
            python - "$log" "$expected" <<'PY'
          import pathlib,re,sys
          log=pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          want=int(sys.argv[2])
          tests=re.findall(r"^Ran (\d+) tests in ",log,re.MULTILINE)
          assert len(tests)==1 and int(tests[0])==want,(sys.argv[1],tests,want)
          assert re.search(r"^OK$",log,re.MULTILINE),log[-2000:]
          assert not re.search(r"^FAILED(?: |$)",log,re.MULTILINE),log[-2000:]
          PY
            printf '%s|%s|%s\n' "$folder" "$script" "$expected" >> "$PROOF/manifest.txt"
            total=$((total+expected))
          done <<'SUITES'
          examples/apps/app028_local_exclusive_resume|test_app028.py|12
          examples/apps/app027_verified_reconstructed_resume|test_app027.py|12
          examples/apps/app026_verified_checkpoint_reconstruction|test_app026.py|12
          examples/apps/app025_interrupted_dag_forensics|test_app025.py|24
          examples/apps/app024_verified_concurrent_resume|test_app024.py|24
          examples/apps/app023_bounded_concurrent_dag|test_app023.py|24
          examples/apps/app022_live_freshness_witness|test_app022.py|26
          examples/apps/app021_authority_rotation|test_app021.py|40
          examples/apps/app020_signed_head_provenance|test_app020.py|40
          examples/apps/app019_external_head_pin|test_app019.py|40
          examples/apps/app018_local_freshness|test_app018.py|40
          examples/apps/app017_receiver_revocation|test_app017.py|40
          examples/apps/app016_receiver_trust_policy|test_app016.py|40
          examples/apps/cert015_bureau_replay|test_cert015_r1.py|20
          examples/apps/app015_independent_native_replay|test_app015.py|40
          examples/apps/app014_portable_checkpoint|test_app014.py|40
          examples/apps/app013_verified_handoff|test_app013.py|40
          examples/apps/app012_clean_checkpoint|test_app012.py|40
          examples/apps/app011_verified_resume|test_app011.py|40
          examples/apps/app010_readonly_dag_audit|test_app010.py|40
          examples/apps/app009_agent_dag|test_app009.py|40
          examples/apps/app008_conditional_workflow|test_app008.py|33
          examples/apps/app007_pinned_replay|test_app007.py|24
          examples/apps/app006_readonly_audit|test_app006.py|40
          examples/apps/app005_agent_batch|test_app005.py|40
          examples/apps/app004_agent_json|test_agent_request.py|40
          examples/apps/app004_agent_json|test_app004.py|31
          examples/apps/app003_integrated_quality|test_app003.py|38
          examples/apps/app002_rule_bundle|test_app002.py|26
          examples/apps/app001_quality_gate|test_app001.py|16
          SUITES
          test "$index" -eq 30
          test "$total" -eq 962
          echo "APP028_SUITE_COUNT=30" | tee "$PROOF/qualification.txt"
          echo "APP028_TESTS_PER_OS=962" | tee -a "$PROOF/qualification.txt"
          echo "APP028_NEW_TESTS=12" | tee -a "$PROOF/qualification.txt"
          echo "APP028_REGRESSIONS=950" | tee -a "$PROOF/qualification.txt"
          echo "APP028_UNLOGGED_NATIVE_EFFECTS=BLOCKED" | tee -a "$PROOF/qualification.txt"
          echo "APP028_PRODUCTION=NOT_AUTHORIZED" | tee -a "$PROOF/qualification.txt"
      - name: Real competing native continuations demonstration
        shell: bash
        run: |
          set -euo pipefail
          python -B examples/apps/app028_local_exclusive_resume/demo_app028.py \
            "$RUNNER_TEMP/NORDOI_APP028_EXCLUSIVE_PROOFS" \
            2>&1 | tee "$RUNNER_TEMP/NORDOI_APP028_EXCLUSIVE_PROOFS/demo.log"
      - name: Archive native continuation evidence for Bureau
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NORDOI_APP028_EXCLUSIVE_${{ matrix.os }}
          path: ${{ runner.temp }}/NORDOI_APP028_EXCLUSIVE_PROOFS/
          retention-days: 30
