name: NORDOI G0.3 R3-R12 in-process probe smoke
on:
  pull_request:
    paths:
      - 'research/g03_r3_r12_kernel_probe.rs'
      - 'research/G03_R3_R12_INPROCESS_ENGINEERING.md'
      - '.github/workflows/g03_r3_r12_inprocess.yml'
  workflow_dispatch:
jobs:
  atomic-probe:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify actual Rust kernel probe (not benchmark evidence)
        shell: bash
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          cargo build --offline --release --lib
          LIB="$(find target/release/deps -name 'libnordoi_kernel-*.rlib' -print | head -n 1)"
          test -n "$LIB"
          OUT="probe"
          if [ "$RUNNER_OS" = "Windows" ]; then OUT="probe.exe"; fi
          rustc --edition=2021 -O -L dependency=target/release/deps --extern "nordoi_kernel=$LIB" research/g03_r3_r12_kernel_probe.rs -o "$OUT"
          "./$OUT" selftest
          "./$OUT" measure 100 3 > probe.json
          python -c "import json; d=json.load(open('probe.json')); assert d['schema']=='NORDOI-G03-R3-R12-INPROCESS-v1' and d['blocks']==3 and len(d['cases'])==6 and d['production']=='NOT_AUTHORIZED'; print('G03_R3_R12_CI_SMOKE=PASS')"
