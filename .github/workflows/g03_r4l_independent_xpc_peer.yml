name: NORDOI G0.3 R4L independently signed XPC peer
on:
  pull_request:
    paths:
      - 'tests/g03_r4l_independently_signed_xpc_peer_lab.rs'
      - 'research/G03_R4L_INDEPENDENTLY_SIGNED_XPC_PEER_LAB.md'
      - '.github/workflows/g03_r4l_independent_xpc_peer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-native-macos-signed-siblings:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: R4L exact signed peer reachability, XPC denial and handler non-delivery
        run: cargo test --offline --release --test g03_r4l_independently_signed_xpc_peer_lab -- --nocapture
      - name: R4K baseline native parent unaffected
        run: cargo test --offline --release --test g03_r4k_xpc_peer_identity_confused_deputy_lab
      - name: Strict rustfmt
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --offline --all-targets -- -D warnings
  portable-default-denial-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: R4L never claims XPC on a non-macOS host
        run: cargo test --offline --release --test g03_r4l_independently_signed_xpc_peer_lab
