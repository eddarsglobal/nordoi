name: NORDOI APP-006 read-only real agent batch audit
on:
  pull_request:
    paths:
      - 'examples/apps/app006_readonly_audit/**'
      - '.github/workflows/nordoi_app006_readonly_audit.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  real-readonly-audit-four-os:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15, ubuntu-latest, windows-latest]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact SHA and unchanged historical Guardian gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          python -B scripts/roadmap_guardian.py --audit
          python -B scripts/verify_ai_only_continuation.py --audit
      - name: Build real native NORDOI APP005 engine for generating source-backed outputs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --offline --bin nordoi
      - name: Forty offline APP006 read-only tampering and partial-commit audits
        run: python -B -m unittest discover -s examples/apps/app006_readonly_audit -p test_app006.py -v
      - name: Preserve forty real APP005 batch tests
        run: python -B -m unittest discover -s examples/apps/app005_agent_batch -p test_app005.py -v
      - name: Preserve forty APP004-R2 native JSON stdin tests
        run: python -B -m unittest discover -s examples/apps/app004_agent_json -p test_agent_request.py -v
      - name: Preserve thirty-one APP004-R1 JSON tests
        run: python -B -m unittest discover -s examples/apps/app004_agent_json -p test_app004.py -v
      - name: Preserve thirty-eight APP003 native source tests
        run: python -B -m unittest discover -s examples/apps/app003_integrated_quality -p test_app003.py -v
      - name: Preserve twenty-six APP002 native rule bridge tests
        run: python -B -m unittest discover -s examples/apps/app002_rule_bundle -p test_app002.py -v
      - name: Preserve sixteen APP001 authentic file tests
        run: python -B -m unittest discover -s examples/apps/app001_quality_gate -p test_app001.py -v
      - name: Produce actual native batch, independently audit without any effect
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/nordoi_app006_evidence"
          BATCH="$EVIDENCE/native-batch"
          mkdir -p "$BATCH"
          ENGINE="$PWD/target/debug/nordoi"
          if [ "$RUNNER_OS" = "Windows" ]; then ENGINE="$ENGINE.exe"; fi
          python -B examples/apps/app005_agent_batch/run_app005.py \
            --scores 73 59 60 --engine "$ENGINE" --output-parent "$BATCH" \
            > "$EVIDENCE/real_native_receipts.jsonl"
          ACTUAL_ROOT="$(find "$BATCH" -maxdepth 1 -type d -name 'NORDOI_APP005_*' | head -n 1)"
          test -n "$ACTUAL_ROOT"
          python -B examples/apps/app006_readonly_audit/audit_app006.py \
            --batch-root "$ACTUAL_ROOT" \
            --receipts "$EVIDENCE/real_native_receipts.jsonl" \
            > "$EVIDENCE/real_offline_audit.json"
          python -B - "$EVIDENCE" <<'PY'
          import json,pathlib,sys
          path=pathlib.Path(sys.argv[1])
          receipt=[json.loads(x) for x in (path/"real_native_receipts.jsonl").read_text(encoding="utf-8").splitlines()]
          report=json.loads((path/"real_offline_audit.json").read_text(encoding="utf-8"))
          assert [x["decision"] for x in receipt]==[1,0,1]
          assert report["status"]=="PASS", report
          assert report["committed_jobs_verified"]==3
          assert len(report["jobs"])==3
          assert all(len(x["files"])==2 for x in report["jobs"])
          assert report["attestation"]=="READ_ONLY_CONTENT_CONSISTENCY_NOT_AUTHENTICATED_SIGNATURE"
          print("APP006_NATIVE_BATCH_AUDIT_REAL_FILES=PASS")
          print("APP006_REAL_COMMITTED_JOBS=3")
          print("APP006_REAL_FILE_BYTES_VERIFIED=6_FILES")
          PY
      - name: Exact-head C20, read-only audit and no-human governance gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          python -B scripts/roadmap_guardian.py --audit
          python -B scripts/verify_ai_only_continuation.py --audit
          echo "APP006_NATIVE_OFFLINE_CONTENT_CONSISTENCY=PASS"
          echo "APP006_AGENT_AUDIT_FILE_WRITE=NONE"
          echo "APP006_INDEPENDENT_P27_SIGNATURE=NOT_CLAIMED"
          echo "APP006_HUMAN_TESTERS=0"
          echo "APP006_PRODUCTION=NOT_AUTHORIZED"
      - name: Archive actual native batch and read-only machine verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NORDOI_APP006_REAL_OFFLINE_BATCH_AUDIT_${{ matrix.os }}
          path: ${{ runner.temp }}/nordoi_app006_evidence/
          retention-days: 30
          if-no-files-found: warn
