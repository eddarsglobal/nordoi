name: NORDOI Production P0.5B Source Lock Gate

on:
  push:
    branches: [production/p0.1]
  pull_request:
    branches: [production/p0.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-clippy:
    name: P0.5B Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Boundary and negative tests
        run: |
          python3 scripts/production_p05b_surface_check.py --repo "$PWD"
          python3 scripts/production_p05b_negative_tests.py
      - name: Format
        run: cargo fmt --manifest-path production/native-effect-p03/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path production/native-effect-p03/Cargo.toml --all-targets -- -D warnings

  check:
    name: P0.5B Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Source lock
        run: python3 scripts/production_p05b_surface_check.py --repo "$PWD"
      - name: Cargo check
        run: cargo check --locked --manifest-path production/native-effect-p03/Cargo.toml --all-targets

  tests:
    name: P0.5B Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Boundary and mutation tests
        shell: bash
        run: |
          python3 scripts/production_p05b_surface_check.py --repo "$PWD"
          python3 scripts/production_p05b_negative_tests.py
      - name: Cargo tests
        run: cargo test --locked --manifest-path production/native-effect-p03/Cargo.toml --all-targets
