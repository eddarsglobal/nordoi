name: NORDOI G0.3 R4G macOS Seatbelt kernel file-denial experiment
on:
  pull_request:
    paths:
      - 'tests/g03_r4g_macos_seatbelt_boundary_lab.rs'
      - 'research/G03_R4G_MACOS_SEATBELT_BOUNDARY_LAB.md'
      - '.github/workflows/g03_r4g_macos_seatbelt_boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-seatbelt-live:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Actual macOS kernel file denial and unsandboxed positive control
        run: cargo test --offline --release --test g03_r4g_macos_seatbelt_boundary_lab -- --nocapture
      - name: Strict Clippy toolchain compatibility
        run: cargo clippy --offline --all-targets -- -D warnings
      - name: Rustfmt
        run: cargo fmt --all -- --check
  other-os-must-not-claim-seatbelt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Explicit absence of macOS sandbox and ExternalIo denial
        run: cargo test --offline --release --test g03_r4g_macos_seatbelt_boundary_lab
