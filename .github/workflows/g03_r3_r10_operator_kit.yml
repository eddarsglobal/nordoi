name: NORDOI G0.3 R3-R10 operator research synthetic gate
on:
  pull_request:
    paths:
      - 'research/G03_R3_R10_INDEPENDENT_NOVICE_OPERATIONS.md'
      - 'research/g03_r3_r10_operator_kit.py'
      - '.github/workflows/g03_r3_r10_operator_kit.yml'
  workflow_dispatch:
jobs:
  synthetic-selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic operator and consent gate (NO human records)
        run: python -B research/g03_r3_r10_operator_kit.py selftest
