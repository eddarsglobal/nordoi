name: NORDOI G0.3 R3-R7 pedagogical research selftest
on:
  pull_request:
    paths:
      - 'research/G03_R3_R7_BEGINNER_ERROR_GUIDANCE.md'
      - 'research/g03_r3_r7_beginner_error_review.py'
      - '.github/workflows/g03_r3_r7_beginner_error_review.yml'
  workflow_dispatch:
jobs:
  python-selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Read-only synthetic research selftest
        run: python -B research/g03_r3_r7_beginner_error_review.py selftest
