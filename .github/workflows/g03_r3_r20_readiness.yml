name: NORDOI G0.3 R3-R20 governed integration readiness

on:
  pull_request:
    paths:
      - 'research/g03_r3_r20_integration_readiness.py'
      - 'research/g03_r3_r20_security_probe.rs'
      - 'research/G03_R3_R20_INTEGRATION_READINESS.md'
      - '.github/workflows/g03_r3_r20_readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-release-test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source tampering and inventory negative tests
        run: python -B research/g03_r3_r20_integration_readiness.py selftest
      - name: Real pinned baseline and candidate release integration tests
        run: python -B research/g03_r3_r20_integration_readiness.py check --safety-source research/g03_r3_r20_security_probe.rs
