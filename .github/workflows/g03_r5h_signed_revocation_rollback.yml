name: NORDOI G0.3 R5H signed revocation possession and rollback limits (deny-only)
on:
  pull_request:
    paths:
      - 'research/g03_r5h_signed_revocation_lab.py'
      - 'research/test_g03_r5h_signed_revocation_lab.py'
      - 'research/G03_R5H_NO_EXTERNAL_REVOCATION_AUTHORITY.json'
      - 'research/G03_R5H_SIGNED_REVOCATION_CUSTODY_LIMITS.md'
      - '.github/workflows/g03_r5h_signed_revocation_rollback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-signed-revocation-not-independent-custody:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: R5H real OpenSSH Ed25519 signed revoke, local anti-replay, actual SQLite rollback
        run: python -B -m unittest discover -s research -p 'test_g03_r5h_signed_revocation_lab.py' -v
      - name: R5G same-UID revocation custody control regression
        run: python -B -m unittest discover -s research -p 'test_g03_r5g_effective_control_lab.py' -v
      - name: R5F owner control disqualification regression
        run: python -B -m unittest discover -s research -p 'test_g03_r5f_admin_custody_disqualifiers.py' -v
      - name: R5E two-local-database rollback regression
        run: python -B -m unittest discover -s research -p 'test_g03_r5e_second_store_witness.py' -v
      - name: R5D local spent nonce regression
        run: python -B -m unittest discover -s research -p 'test_g03_r5d_local_monotonic_ledger.py' -v
      - name: R5C owner OOB not enrolled regression
        run: python -B -m unittest discover -s research -p 'test_g03_r5c_oob_root_consistency.py' -v
      - name: R5B real three-role OpenSSH possession not independent custody
        run: python -B -m unittest discover -s research -p 'test_g03_r5b_triple_sshsig_verifier.py' -v
      - name: R5A independent operator absence regression
        run: python -B -m unittest discover -s research -p 'test_g03_r5a_external_operator_preflight.py' -v
      - name: R4Z guardian handoff absence regression
        run: python -B -m unittest discover -s research -p 'test_g03_r4z_handoff.py' -v
      - name: R4Y genuine custody refusal regression
        run: python -B -m unittest discover -s research -p 'test_g03_r4y_external_custody_intake.py' -v
      - name: Revocation fixture cannot certify real external custodian
        shell: bash
        run: |
          set -euo pipefail
          python -B -c 'import json; x=json.load(open("research/G03_R5H_NO_EXTERNAL_REVOCATION_AUTHORITY.json", encoding="utf-8")); assert x["real_independent_guardian"] is None and x["owner_authenticated_out_of_band_root"] is None and x["independently_held_revocation_private_key"] is None and x["externally_protected_revocation_ledger"] is None and x["independently_governed_recovery_and_key_rotation"] is None and x["global_monotonic_antirollback"]=="NOT_IMPLEMENTED" and x["native_admission_gates_unmet"]==12 and x["production"]=="NOT_AUTHORIZED"'
