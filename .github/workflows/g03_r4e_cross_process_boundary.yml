name: NORDOI G0.3 R4E real child-process boundary lab
on:
  pull_request:
    paths:
      - 'tests/g03_r4e_cross_process_host_boundary_lab.rs'
      - 'research/G03_R4E_CROSS_PROCESS_HOST_BOUNDARY_LAB.md'
      - '.github/workflows/g03_r4e_cross_process_boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  child-process-witness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Actual subprocess IPC and host-only authority witness
        run: cargo test --offline --release --test g03_r4e_cross_process_host_boundary_lab
      - name: Formatting
        run: cargo fmt --all -- --check
