name: NORDOI G0.3 R4Y external custodian evidence intake (deny-only)
on:
  pull_request:
    paths:
      - 'research/g03_r4y_external_custody_intake.py'
      - 'research/test_g03_r4y_external_custody_intake.py'
      - 'research/G03_R4Y_EXTERNAL_CUSTODY_EMPTY_INTAKE.json'
      - 'research/G03_R4Y_REAL_INDEPENDENT_CUSTODY_QUALIFICATION.md'
      - '.github/workflows/g03_r4y_external_custody_intake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deny-only-intake:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Real adverse input tests; no independent custodian claimed
        run: python -B -m unittest discover -s research -p 'test_g03_r4y_external_custody_intake.py' -v
      - name: Unenrolled custody inventory must BLOCK, exit two
        shell: bash
        run: |
          set +e
          python -B research/g03_r4y_external_custody_intake.py --manifest research/G03_R4Y_EXTERNAL_CUSTODY_EMPTY_INTAKE.json > r4y_verdict.json
          code=$?
          set -e
          test "$code" -eq 2
          python -B -c 'import json; x=json.load(open("r4y_verdict.json", encoding="utf-8")); assert x["status"] == "BLOCK" and x["admission"] == "NOT_AUTHORIZED" and x["missing_gates"] == ["G1","G2","G3","G4","G5","G6"]'
