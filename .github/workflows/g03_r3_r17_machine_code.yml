name: NORDOI G0.3 R3-R17 require witness codegen safety gate

on:
  pull_request:
    paths:
      - 'research/g03_r3_r17_machine_code_audit.py'
      - 'research/g03_r3_r17_require_witness.rs'
      - 'research/G03_R3_R17_MACHINE_CODE_AUDIT.md'
      - '.github/workflows/g03_r3_r17_machine_code.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  witness-safety-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python symbol parser negative tests
        run: python -B research/g03_r3_r17_machine_code_audit.py selftest
      - name: Real offline release Rust witness safety contract
        run: python -B research/g03_r3_r17_machine_code_audit.py smoke --source .
