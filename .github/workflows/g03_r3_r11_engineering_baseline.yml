name: NORDOI G0.3 R3-R11 engineering baseline synthetic selftest
on:
  pull_request:
    paths:
      - 'research/g03_r3_r11_engineering_baseline.py'
      - 'research/G03_R3_R11_ENGINEERING_MISSION.md'
      - '.github/workflows/g03_r3_r11_engineering_baseline.yml'
  workflow_dispatch:
jobs:
  synthetic-selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated synthetic validation only (never claim benchmark performance)
        run: python -B research/g03_r3_r11_engineering_baseline.py selftest
