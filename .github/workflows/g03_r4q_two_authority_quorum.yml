name: NORDOI G0.3 R4Q two-authority signer compromise lab
on:
  pull_request:
    paths:
      - 'tests/g03_r4q_two_authority_quorum_compromise_lab.rs'
      - 'research/G03_R4Q_TWO_AUTHORITY_QUORUM_ADMIN_COMPROMISE_LAB.md'
      - '.github/workflows/g03_r4q_two_authority_quorum.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-macos-dual-signer-quorum:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Two Ed25519 authorities, compromised primary and independent-head rollback counterexample
        run: cargo test --offline --release --test g03_r4q_two_authority_quorum_compromise_lab -- --nocapture
      - name: R4P genuine live GitHub external witness predecessor unchanged
        if: always()
        run: cargo test --offline --release --test g03_r4p_remote_signed_monotonic_witness_lab
      - name: Exact Rustfmt
        if: always()
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        if: always()
        run: cargo clippy --offline --all-targets -- -D warnings
  portable-default-denial:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Portable does not claim independent Mac administrative witness
        run: cargo test --offline --release --test g03_r4q_two_authority_quorum_compromise_lab
