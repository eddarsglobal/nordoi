name: NORDOI G0.3 R4S guardian signed checkpoint chain lab
on:
  pull_request:
    paths:
      - 'tests/g03_r4s_guardian_checkpoint_chain_protocol_lab.rs'
      - 'research/G03_R4S_GUARDIAN_CHAIN_ROTATION_PROTOCOL_LAB.md'
      - '.github/workflows/g03_r4s_guardian_checkpoint_chain.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-guardian-chain:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Native Ed25519 lineage, two-signer rotation and full rollback counterexample
        run: cargo test --offline --release --test g03_r4s_guardian_checkpoint_chain_protocol_lab -- --nocapture
      - name: R4R live remote floor and nonce predecessor remains unchanged
        if: always()
        run: cargo test --offline --release --test g03_r4r_fresh_challenge_remote_floor_lab
      - name: Strict Rustfmt
        if: always()
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        if: always()
        run: cargo clippy --offline --all-targets -- -D warnings
  portable-no-claim:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: No native guardian or independent administrative claims
        run: cargo test --offline --release --test g03_r4s_guardian_checkpoint_chain_protocol_lab
