name: NORDOI G0.3 R4C real native file resource lab
on:
  pull_request:
    paths:
      - 'tests/g03_r4c_native_file_resource_lab.rs'
      - 'research/G03_R4C_NATIVE_FILE_RESOURCE_LAB.md'
      - '.github/workflows/g03_r4c_native_file_lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-file-boundary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Real OS file resource, join and cancellation tests
        run: cargo test --offline --release --test g03_r4c_native_file_resource_lab
      - name: Formatting gate
        run: cargo fmt --all -- --check
