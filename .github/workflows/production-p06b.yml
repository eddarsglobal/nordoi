name: NORDOI Production P0.6B Per-Dispatch Anchor Barrier Gate

on:
  push:
    branches: [production/p0.1]
  pull_request:
    branches: [production/p0.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-clippy:
    name: P0.6B Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Boundary policy
        run: python3 scripts/production_p06b_boundary_check.py --repo "$PWD"
      - name: Format
        run: |
          cargo fmt --manifest-path production/native-effect-p03/Cargo.toml -- --check
          cargo fmt --manifest-path production/native-rollback-p06/Cargo.toml -- --check
          cargo fmt --manifest-path production/native-effect-profile-p05c/Cargo.toml -- --check
      - name: Clippy
        run: |
          cargo clippy --locked --manifest-path production/native-effect-p03/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path production/native-rollback-p06/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path production/native-effect-profile-p05c/Cargo.toml --all-targets -- -D warnings

  check:
    name: P0.6B Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Boundary policy
        run: python3 scripts/production_p06b_boundary_check.py --repo "$PWD"
      - name: Cargo check
        run: |
          cargo check --locked --manifest-path production/native-effect-p03/Cargo.toml --all-targets
          cargo check --locked --manifest-path production/native-rollback-p06/Cargo.toml --all-targets
          cargo check --locked --manifest-path production/native-effect-profile-p05c/Cargo.toml --all-targets

  tests:
    name: P0.6B Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Boundary policy
        shell: bash
        run: python3 scripts/production_p06b_boundary_check.py --repo "$PWD"
      - name: P0.3/P0.4/P0.5A regression tests
        run: cargo test --locked --manifest-path production/native-effect-p03/Cargo.toml --all-targets
      - name: P0.6A regression tests
        run: cargo test --locked --manifest-path production/native-rollback-p06/Cargo.toml --all-targets
      - name: P0.6B ordering tests
        run: cargo test --locked --manifest-path production/native-effect-p03/Cargo.toml --test p06b_anchor
