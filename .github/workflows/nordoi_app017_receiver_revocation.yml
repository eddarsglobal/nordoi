          echo "APP016_MERGE=NONE"
          echo "APP016_PRODUCTION=NOT_AUTHORIZED"\n          echo "APP017_C20_PARENT=APP016_13_OF_13_SUCCESS"\n          echo "APP017_BUREAU_VERDICT=PENDING_ALL_CI"\n          echo "APP017_PRODUCTION=NOT_AUTHORIZED"
      - name: Genuine AI receiver policy rotation, revocation and frozen admission
        shell: bash
        run: |
          set -euo pipefail
          python -B - "$RUNNER_TEMP" <<'PY'
          import hashlib,json,pathlib,sys
          repo=pathlib.Path.cwd()
          work=pathlib.Path(sys.argv[1])/"NORDOI_APP017_REAL_REVOCATION_ROSTER"
          work.mkdir(parents=True,exist_ok=True)
          sys.path.insert(0,str(repo/"examples/apps/app017_receiver_revocation"))
          import test_app017
          import roster_app017 as roster
          cls=test_app017.ReceiverRevocationRoster
          cls.setUpClass()
          try:
            # Receiver policy A, generation 1. Real Rust from APP012 produces
            # native historical receipts. APP013/014 carry exact evidence.
            first=cls("test_01_v1_roster_status_active_without_native_engine")
            first.setUp()
            try:
              state=first.good("status")[1][0]
              assert state["status"]=="ACTIVE" and state["generation"]==1
              (work/"V1_ACTIVE.json").write_text(json.dumps(state,sort_keys=True)+"\n",encoding="utf-8")
              inspect=first.good("inspect")[1][0]
              assert inspect["native_engine"]=="NOT_EXECUTED"
              (work/"V1_INSPECT_NO_RUST.json").write_text(json.dumps(inspect,sort_keys=True)+"\n",encoding="utf-8")
              verified=first.good("verify")[1][0]
              assert verified["native_jobs_recomputed"]==2,verified
              (work/"V1_GENUINE_RUST_REPLAY.json").write_text(json.dumps(verified,sort_keys=True)+"\n",encoding="utf-8")
              created=first.good("restore")[1][0]
              assert created["status"]=="RESTORED",created
              suffix,rows=first.good("resume")
              assert [x["step"] for x in rows]==[3,4],rows
              combined=work/"V1_REAL_COMPLETE_DAG.jsonl"
              combined.write_bytes((first.fx.portable/"handoff/native-prefix.jsonl").read_bytes()+suffix.stdout)
              audited,status=roster.portable.independent.audit(
                first.fx.dest,first.fx.portable/"handoff/plan.json",
                combined,first.fx.policy["plan_sha256"])
              assert status==0 and audited["status"]=="PASS",audited
              (work/"V1_APP010_INDEPENDENT_AUDIT.json").write_text(
                  json.dumps(audited,sort_keys=True)+"\n",encoding="utf-8")
              first.rejected("ROOT_UNEXPECTED_JOB_OR_FILE","resume")
            finally:
              first.tearDown()

            # A new sender cannot override the receiver's chosen policy.
            # Rotate to generation 2: active policy B, A explicitly revoked.
            second=cls("test_01_v1_roster_status_active_without_native_engine")
            second.setUp()
            try:
              old_pin=second.original_policy_sha
              old_roster_pin=second.anchor
              new_pin=second.rotated()
              assert new_pin!=old_pin
              current=second.good("status")[1][0]
              assert current["status"]=="ACTIVE" and current["generation"]==2
              assert current["revoked_count"]==1
              (work/"V2_ROTATED_REVOCATION.json").write_text(
                  json.dumps(current,sort_keys=True)+"\n",encoding="utf-8")
              second.rejected("ROSTER_EXTERNAL_PIN_MISMATCH",
                              anchor=old_roster_pin)
              second.rejected("RECEIVER_POLICY_EXTERNAL_PIN_MISMATCH",
                              policy_file=second.original_policy,
                              package=second.original_pkg)
              second.good("inspect",min_generation=2)
              second.rejected("ROSTER_BELOW_RECEIVER_MINIMUM_GENERATION",
                              min_generation=3)
              alt=second.good("verify",source=second.fx.alt_source,
                              min_generation=2)[1][0]
              assert alt["native_jobs_recomputed"]==2,alt
              (work/"V2_ALTERNATIVE_PINNED_RUST_REPLAY.json").write_text(
                  json.dumps(alt,sort_keys=True)+"\n",encoding="utf-8")
              second.rejected("SOURCE_PIN_MISMATCH","verify")
              r=second.good("restore",source=second.fx.alt_source,
                            min_generation=2)[1][0]
              assert r["status"]=="RESTORED",r
              continued,rows=second.good("resume",source=second.fx.alt_source,
                                         min_generation=2)
              assert [x["step"] for x in rows]==[3,4],rows
              joined=work/"V2_REAL_ALTERNATIVE_COMPLETE_DAG.jsonl"
              joined.write_bytes((second.fx.portable/"handoff/native-prefix.jsonl").read_bytes()+continued.stdout)
              checked,code=roster.portable.independent.audit(
                second.fx.dest,second.fx.portable/"handoff/plan.json",
                joined,second.fx.policy["plan_sha256"])
              assert code==0 and checked["status"]=="PASS",checked
              (work/"V2_APP010_INDEPENDENT_AUDIT.json").write_text(
                  json.dumps(checked,sort_keys=True)+"\n",encoding="utf-8")
              frozen_before=second.fx.native_hashes(second.fx.dest)
              second.frozen()
              state=second.good("status")[1][0]
              assert state["status"]=="FROZEN" and state["active_policy_sha256"] is None
              second.rejected("ROSTER_FROZEN_DENIES_ADMISSION","inspect")
              second.rejected("ROSTER_FROZEN_DENIES_ADMISSION","verify")
              second.rejected("ROSTER_FROZEN_DENIES_ADMISSION","restore")
              second.rejected("ROSTER_FROZEN_DENIES_ADMISSION","resume")
              assert frozen_before==second.fx.native_hashes(second.fx.dest)
              (work/"V2_FROZEN_NO_EFFECT.json").write_text(
                  json.dumps(state,sort_keys=True)+"\n",encoding="utf-8")
            finally:
              second.tearDown()

            # Independent stale roster; receiver requires generation >= 2.
            stale=cls("test_01_v1_roster_status_active_without_native_engine")
            stale.setUp()
            try:
              stale.rejected("ROSTER_BELOW_RECEIVER_MINIMUM_GENERATION",
                             min_generation=2)
              (work/"RECEIVER_MINIMUM_GENERATION_ENFORCED.txt").write_text(
                  "stale roster generation 1 rejected under minimum 2\n",encoding="utf-8")
            finally:
              stale.tearDown()
          finally:
            cls.tearDownClass()
          print("APP017_RECEIVER_ROSTER_EXTERNAL_PIN=PASS")
          print("APP017_GENERATION1_NATIVE_REPLAY_AND_RESUME=PASS")
          print("APP017_GENERATION2_RECEIVER_ROTATION=PASS")
          print("APP017_OLD_POLICY_REVOKED_BY_NEW_ROSTER=PASS")
          print("APP017_OLD_ROSTER_SHA_REFUSED=PASS")
          print("APP017_ALTERNATIVE_NATIVE_RULES_PINNED=PASS")
          print("APP017_GENERATION2_APP010_FINAL_DAG=PASS")
          print("APP017_FROZEN_DENIES_ALL_ADMISSIONS=PASS")
          print("APP017_FROZEN_PRESERVES_NATIVE_FILES=PASS")
          print("APP017_MINIMUM_GENERATION_ENFORCED=PASS")
          print("APP017_DURABLE_ANTI_ROLLBACK=NOT_CLAIMED")
          print("APP017_EXTERNAL_SIGNATURE=NOT_CLAIMED")
          print("APP017_HUMAN_TESTERS=0")
          PY
