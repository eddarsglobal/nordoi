name: NORDOI G0.3 R6D real five-signature admin domain negative provenance
on:
  pull_request:
    paths:
      - 'research/g03_r6d_admin_domain_provenance.py'
      - 'research/test_g03_r6d_admin_domain_provenance.py'
      - 'research/G03_R6D_ADMIN_DOMAIN_NO_EXTERNAL_CUSTODY.json'
      - 'research/G03_R6D_ADMIN_DOMAIN_PROVENANCE_QUALIFICATION.md'
      - '.github/workflows/g03_r6d_admin_domain_provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-same-admin-os-domain-provenance-deny-only:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: R6D actual OS identity and genuine five-signature domain provenance
        run: python -B -m unittest discover -s research -p 'test_g03_r6d_admin_domain_provenance.py' -v
      - name: R6A through R6C original source-bound crypto research controls
        run: python -B -m unittest discover -s research -p 'test_g03_r6*.py' -v
      - name: R5A through R5Z signed negative research regressions
        run: python -B -m unittest discover -s research -p 'test_g03_r5*.py' -v
      - name: R4Z original independent handoff negative tests
        run: python -B -m unittest discover -s research -p 'test_g03_r4z_handoff.py' -v
      - name: R4Y original independent custodian intake denial
        run: python -B -m unittest discover -s research -p 'test_g03_r4y_external_custody_intake.py' -v
      - name: Original genuine native R4M XPC CDHash six tests serial once no waiver
        if: startsWith(matrix.os, 'macos')
        timeout-minutes: 8
        run: cargo test --offline --release --test g03_r4m_pinned_code_identity_lab -- --nocapture --test-threads=1
      - name: All twelve original independent administrative native gates remain unmet
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import json
          old=json.load(open('research/G03_R6C_TWO_KEY_NO_INDEPENDENT_QUORUM.json',encoding='utf-8'))
          new=json.load(open('research/G03_R6D_ADMIN_DOMAIN_NO_EXTERNAL_CUSTODY.json',encoding='utf-8'))
          a,b=old['required_gates'],new['required_gates']
          assert len(a)==len(b)==12
          assert [x['id'] for x in a]==[x['id'] for x in b]
          assert all(x['status']=='UNMET_INDEPENDENT_EXTERNAL_EVIDENCE' for x in b)
          assert new['native_admission_gates_unmet']==12
          assert new['owner_out_of_band_root'] is None
          assert new['real_independent_operator'] is None
          assert new['independently_managed_guardian_private_key'] is False
          assert new['independent_quorum'] is False
          assert new['independently_protected_global_monotonic_history'] is False
          assert new['production']=='NOT_AUTHORIZED'
          print('R6D_ALL_12_EXTERNAL_ADMIN_GATES=UNMET; PRODUCTION=NOT_AUTHORIZED')
          PY
