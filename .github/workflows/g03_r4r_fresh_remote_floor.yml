name: NORDOI G0.3 R4R freshness signed off-device high-water lab
on:
  pull_request:
    paths:
      - 'tests/g03_r4r_fresh_challenge_remote_floor_lab.rs'
      - 'research/G03_R4R_NONCE_SIGNED_REMOTE_FLOOR_LAB.md'
      - '.github/workflows/g03_r4r_fresh_remote_floor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-macos-signed-floor-freshness:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Real remote SSHSIG V2 floor and fresh-nonce B signature
        run: cargo test --offline --release --test g03_r4r_fresh_challenge_remote_floor_lab -- --nocapture
      - name: R4Q predecessor two-signer and B-head rollback counterexample
        if: always()
        run: cargo test --offline --release --test g03_r4q_two_authority_quorum_compromise_lab
      - name: Strict Rustfmt
        if: always()
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        if: always()
        run: cargo clippy --offline --all-targets -- -D warnings
  portable-deny-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Portable does not claim native Mac remote-floor authority
        run: cargo test --offline --release --test g03_r4r_fresh_challenge_remote_floor_lab
