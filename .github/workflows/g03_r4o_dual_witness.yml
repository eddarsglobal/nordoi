name: NORDOI G0.3 R4O owner-pinned root two-witness research
on:
  pull_request:
    paths:
      - 'tests/g03_r4o_owner_pinned_root_two_witness_lab.rs'
      - 'research/G03_R4O_PINNED_ROOT_DUAL_WITNESS_LAB.md'
      - '.github/workflows/g03_r4o_dual_witness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-macos-root-witness:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Root pin, actual SSHSIG, native CDHash and two-witness counterexample
        run: cargo test --offline --release --test g03_r4o_owner_pinned_root_two_witness_lab -- --nocapture
      - name: R4N signed authority regression
        if: always()
        run: cargo test --offline --release --test g03_r4n_offline_root_signed_authority_lab
      - name: Strict Rustfmt
        if: always()
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        if: always()
        run: cargo clippy --offline --all-targets -- -D warnings
  portable-deny:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: No macOS root or monotonic witness claim on portable OS
        run: cargo test --offline --release --test g03_r4o_owner_pinned_root_two_witness_lab
