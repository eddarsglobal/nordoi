name: NORDOI Production P0.4 In-Doubt Delivery Gate
on:
  push:
    branches:
      - production/p0.1
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: P0.4 Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path production/native-effect-p03/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path production/native-effect-p03/Cargo.toml --all-targets -- -D warnings
  check:
    name: P0.4 Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked --manifest-path production/native-effect-p03/Cargo.toml --all-targets
  test:
    name: P0.4 Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path production/native-effect-p03/Cargo.toml --all-targets
