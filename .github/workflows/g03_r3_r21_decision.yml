name: NORDOI G0.3 R3-R21 formal engineering decision policy gate

on:
  pull_request:
    paths:
      - 'research/g03_r3_r21_engineering_decision.json'
      - 'research/g03_r3_r21_decision_gate.py'
      - 'research/G03_R3_R21_ENGINEERING_DECISION.md'
      - '.github/workflows/g03_r3_r21_decision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-policy-negative-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact frozen engineering decision and reject policy tampering
        run: python -B research/g03_r3_r21_decision_gate.py selftest --manifest research/g03_r3_r21_engineering_decision.json
