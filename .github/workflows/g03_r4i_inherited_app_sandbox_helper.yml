name: NORDOI G0.3 R4I inherited App Sandbox parent helper
on:
  pull_request:
    paths:
      - 'tests/g03_r4i_inherited_app_sandbox_helper_lab.rs'
      - 'research/G03_R4I_INHERITED_APP_SANDBOX_HELPER_LAB.md'
      - '.github/workflows/g03_r4i_inherited_app_sandbox_helper.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-signed-inheritance-actual-denial:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Genuine ad-hoc signed parent posix_spawn signed inherited child; kernel file-access denials
        run: cargo test --offline --release --test g03_r4i_inherited_app_sandbox_helper_lab -- --nocapture
      - name: Rust 1.98.1 Clippy strict
        run: cargo clippy --offline --all-targets -- -D warnings
      - name: Formatting
        run: cargo fmt --all -- --check
  other-os-no-macos-sandbox-claim:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Explicit absence of macOS helper inheritance and no R0.2 host ExternalIo
        run: cargo test --offline --release --test g03_r4i_inherited_app_sandbox_helper_lab
